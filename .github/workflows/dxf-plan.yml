name: DXF plan checks
on:
  pull_request:
    paths:
      - 'cephepro/assets/site-map/**'
      - 'cephepro/tests/*dxf*'
      - 'cephepro/tests/*dwg*'
      - 'cephepro/lib/*cad*'
      - 'cephepro/lib/*dwg*'
      - 'cephepro/vercel.json'
      - 'cephepro/examples/v252-outline.dxf'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cephepro
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node lib/package-cad.mjs
      - run: node --test tests/site-map*.test.mjs
      - run: node tests/verify-dxf-browser.mjs
